name: Test and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'   # every Monday 09:00 IST: re-assess even without changes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: QA tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - name: Install test tools
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run QA tests
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa/qa-report
            qa/test-results
          retention-days: 14

  security:
    name: Security assessment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: security/package-lock.json
      - name: Install tools
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run dynamic security tests
        run: npx playwright test || echo "Some security tests failed - the assessment step decides whether to block."
      - name: Assess and apply the security gate
        run: node scanner/run.js
      - name: Check tool dependencies for known vulnerabilities
        if: always()
        run: npm audit --audit-level=high || true
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security/results
            security/test-results
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (app files only, no tests)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'qa' --exclude 'security' --exclude '_site' --exclude '*.yml' ./ _site/
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
